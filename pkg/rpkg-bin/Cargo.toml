[package]
name = "rpkg-bin"
version.workspace = true
edition.workspace = true

[[bin]]
name = "rpkg"
path = "src/main.rs"

[dependencies]
# rpkg lib without its default `std` feature so the no_std bin can link.
rpkg = { path = "../rpkg", default-features = false }
libc-lite = { path = "../../libs/libc-lite", features = ["alloc"] }