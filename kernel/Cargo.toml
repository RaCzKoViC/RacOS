[package]
name = "racore"
version.workspace = true
edition.workspace = true

[dependencies]
# compiler_builtins is provided by build-std
#
# racterm is IN-REPO (terminal/), not an external dependency - the kernel's
# zero-external-deps stance (docs/DEPENDENCIES.md) is unchanged. It is
# no_std+alloc, and v0.4 s4.2 renders the console from its Terminal::buffer.
racterm = { path = "../terminal" }

[profile.release]
relocation-model = "static"

[profile.dev]
relocation-model = "static"

[features]
default = []
test_runner = []
# Compile-time gate for the CI boot smoke. When enabled, the kernel runs a
# battery of synchronous assertions right after VFS bring-up and exits the
# guest via isa-debug-exit (port 0xf4) instead of spawning init.
ci-smoke = []
